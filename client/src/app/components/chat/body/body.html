<section class="flex flex-col h-full">

  <!-- Chat Messages -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-white">
    <div *ngFor="let msg of messages" class="flex items-end" [ngClass]="{ 'justify-end': msg.isOwn }">

      <!-- Avatar left for received -->
      <div *ngIf="!msg.isOwn" class="mr-2">
        <!-- <ui5-avatar size="S" [image]="msg.avatar"></ui5-avatar> -->
      </div>

      <!-- Message bubble -->
      <div class="max-w-xs px-4 py-2 rounded-lg text-sm" [ngClass]="{
             'bg-blue-500 text-white': msg.isOwn,
             'bg-gray-200 text-black': !msg.isOwn
           }">
        {{ msg.text }}
      </div>

      <!-- Avatar right for sent -->
      <div *ngIf="msg.isOwn" class="ml-2">
        <!-- <ui5-avatar size="S" [image]="msg.avatar"></ui5-avatar> -->
      </div>
    </div>
  </div>

  <!-- Input Footer -->
  <footer class="p-4 border-t flex items-center gap-2 bg-white">
    <ui5-input class="flex-1" placeholder="Type your message..." [value]="newMessage" (input)="onInputChange($event)"
      (keydown.enter)="emitMessage()"></ui5-input>

    <ui5-button icon="paper-plane" design="Emphasized" (click)="emitMessage()"></ui5-button>
  </footer>

</section>
